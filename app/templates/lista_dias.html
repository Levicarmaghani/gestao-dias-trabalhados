<!--================TABELA USUÁRIO===========================-->
<div class="container mt-4">

    <h1 class="text-center mt-4">Diárias Registradas</h1>
    



<div class="table-responsive shadow-sm rounded mt-2">
    <table class="table table-striped table-hover align-middle mb-0 tabela-registros">

        <thead class="table-dark">
            <tr>
                <th>Local</th>
                <th>Data</th>
                <th>Valor (R$)</th>
                <th>Atividade</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            {% for registro in registros %}
            <tr>
                <td>{{ registro.local }}</td>

                <td>
                    {{ registro.data.strftime('%d/%m/%Y') }}
                </td>

                <td>
                    R$ {{ "%.2f"|format(registro.valor) }}
                </td>

                <td>
                    <a href="{{ url_for ('main.atividades', id=registro.id) }}"
                       class="btn btn-sm btn-primary btn-tabela">
                        Ver detalhes
                    </a>
                </td>

                <td>
                    <form action="{{ url_for('main.excluir', id=registro.id) }}"
                          method="POST"
                          class="form-excluir">

                        <button type="submit"
                                class="btn btn-sm btn-danger btn-tabela">
                            Excluir
                        </button>

                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>

    </table>
</div>
